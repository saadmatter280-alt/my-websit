<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رفيق الدراسة الذكي - النسخة الكاملة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea { user-select: text; }

        body {
            background: #0b1120;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px 16px 80px;
            color: #f1f5f9;
            line-height: 1.5;
        }

        .app-container { max-width: 600px; margin: 0 auto; }

        .hero { text-align: center; margin-bottom: 28px; }
        .hero h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .subjects-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }

        /* تعديل المربع الأول حسب الطلب */
        .subject-window {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 28px;
            padding: 25px 20px;
            border: 1px solid rgba(250, 204, 21, 0.2);
            text-align: center;
            display: block;
            cursor: pointer;
        }

        .subject-name-display { 
            font-size: 1.8rem; 
            font-weight: 900; 
            color: #FFD966; 
            display: block;
            margin-bottom: 5px;
        }
        .days-highlight { 
            color: #10b981; 
            font-size: 2.2rem; 
            font-weight: 900;
            display: block;
        }

        .btn-add {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 15px rgba(16,185,129,0.2);
            margin-bottom: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .details-card {
            background: #1e293b;
            border-radius: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid #facc1533;
        }

        .section-box {
            background: #0f172a;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: block;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 5px;
        }

        .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.95rem; }
        .val { color: #facc15; font-weight: bold; }
        .val-green { color: #10b981; font-weight: bold; }

        input[type="number"], input[type="text"], input[type="date"] {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px;
            color: white;
            width: 100%;
            text-align: center;
            font-size: 1rem;
        }

        .time-input-group { display: flex; gap: 10px; direction: ltr; }

        .btn-submit { background: #facc15; color: #0f172a; padding: 14px; border-radius: 15px; border: none; font-weight: bold; flex: 2; }
        .btn-undo { background: #334155; color: #cbd5e1; padding: 14px; border-radius: 15px; border: none; flex: 1; }
        .btn-delete { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px; border-radius: 12px; width: 100%; margin-top: 20px; font-weight: bold; }
        .btn-save { background: #10b981; color: white; padding: 15px; border-radius: 15px; border: none; width: 100%; font-weight: bold; margin-top: 15px; }

        .close-btn { background: #334155; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #10b981; padding: 10px 20px; border-radius: 50px; font-size: 0.85rem; z-index: 5000;
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="hero">
        <h1>📚 رفيق الدراسة</h1>
        <p>تتبع إنجازك بذكاء</p>
    </div>

    <div id="subjectsGrid" class="subjects-grid"></div>

    <button onclick="addNewSubject()" class="btn-add">➕ إضافة مادة جديدة</button>
    <div style="text-align: center;">
        <span onclick="resetAll()" style="color:#475569; font-size: 0.7rem; text-decoration: underline; cursor:pointer;">إعادة ضبط كافة البيانات</span>
    </div>
</div>

<div id="detailsModal" class="modal-overlay">
    <div class="details-card" id="detailsCard"></div>
</div>

<div id="settingsModal" class="modal-overlay">
    <div class="details-card">
        <h3 style="margin-bottom: 15px; color:#facc15;">⚙️ إعدادات المادة</h3>
        <div id="settingsContent"></div>
        <button onclick="closeSettings()" class="btn-undo" style="width:100%; margin-top:10px;">إلغاء</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "study_app_v13_logic_fix";
    let subjects = [];
    let historyStack = {};

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects)); }

    function load() {
        const raw = localStorage.getItem(STORAGE_KEY);
        subjects = raw ? JSON.parse(raw) : [];
        subjects.forEach(s => { if(!historyStack[s.id]) historyStack[s.id] = []; });
    }

    function getDaysBetween(d1, d2) {
        let date1 = new Date(d1); date1.setHours(0,0,0,0);
        let date2 = new Date(d2); date2.setHours(0,0,0,0);
        return Math.ceil((date1 - date2) / 86400000);
    }

    function calculateFinishDate(examDate, reviewDays) {
        let d = new Date(examDate);
        d.setDate(d.getDate() - reviewDays);
        return d.toISOString().split('T')[0];
    }

    function renderMain() {
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = '';
        if (subjects.length === 0) {
            grid.innerHTML = '<div class="empty-state">لا توجد مواد مضافة حالياً.</div>';
            return;
        }
        subjects.sort((a,b) => getDaysBetween(a.examDate, new Date()) - getDaysBetween(b.examDate, new Date()));
        subjects.forEach(sub => {
            let days = getDaysBetween(sub.examDate, new Date());
            const card = document.createElement('div');
            card.className = 'subject-window';
            card.onclick = () => openDetails(sub.id);
            card.innerHTML = `
                <span class="subject-name-display">${escapeHtml(sub.name)}</span>
                <span class="days-highlight">${days >= 0 ? days : 0}</span>
            `;
            grid.appendChild(card);
        });
    }

    function openDetails(id) {
        const sub = subjects.find(s => s.id === id);
        const modal = document.getElementById('detailsModal');
        const card = document.getElementById('detailsCard');
        
        const actualFinishDate = calculateFinishDate(sub.examDate, sub.reviewDaysBefore);
        const today = new Date();
        const daysToFinish = getDaysBetween(actualFinishDate, today);
        const activeDays = daysToFinish > 0 ? daysToFinish : 1;

        const totalMins = (sub.totalHours * 60) + sub.totalMinutes;
        const doneMins = (sub.studiedHours * 60) + sub.studiedMinutes;
        // الوقت المتبقي هو ما يهم الطالب الآن
        const remMins = Math.max(0, totalMins);
        
        const remSheets = Math.max(0, sub.totalSheets - sub.studiedSheets);
        
        const dailySheets = (remSheets / activeDays).toFixed(1);
        const dailyMins = totalMins / activeDays;
        const dailyH = Math.floor(dailyMins / 60);
        const dailyM = Math.round(dailyMins % 60);

        card.innerHTML = `
            <div class="details-header">
                <h2 style="color:#facc15;">${escapeHtml(sub.name)}</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="section-box">
                <span class="section-title">📊 الحالة الحالية</span>
                <div class="row"><span>الشيتات المنجزة:</span><span class="val">${sub.studiedSheets} / ${sub.totalSheets}</span></div>
                <div class="row"><span>المتبقي للإنجاز (ساعات):</span><span class="val">${sub.totalHours}س ${sub.totalMinutes}د</span></div>
                <div class="row"><span>إجمالي ما ذاكرته:</span><span class="val-green">${sub.studiedHours}س ${sub.studiedMinutes}د</span></div>
            </div>

            <div class="section-box">
                <span class="section-title">🎯 المطلوب إنجازه يومياً</span>
                <div class="row"><span>شيتات:</span><span class="val-green">${dailySheets} شيت</span></div>
                <div class="row"><span>ساعات:</span><span class="val-green">${dailyH}س و ${dailyM}د</span></div>
                <div class="row"><span>الأيام المتبقية للإنجاز:</span><span class="val">${activeDays} أيام</span></div>
            </div>

            <div class="section-box" style="border: 1px dashed #facc1555;">
                <p style="font-weight:bold; margin-bottom:10px; font-size:0.9rem;">✨ إضافة إنجاز (سيتم طرح الوقت تلقائياً):</p>
                <div class="row" style="flex-direction:column; gap:10px;">
                    <label style="font-size:0.8rem; color:#94a3b8;">شيتات خلصتها:</label>
                    <input type="number" id="progSheets" value="0" onfocus="this.select()">
                    
                    <label style="font-size:0.8rem; color:#94a3b8;">وقت المذاكرة الحالي:</label>
                    <div class="time-input-group">
                        <input type="number" id="progHours" value="0" placeholder="ساعة" onfocus="this.select()">
                        <input type="number" id="progMins" value="0" max="59" placeholder="دقيقة" onfocus="this.select()" oninput="if(this.value>59)this.value=59">
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button class="btn-submit" onclick="submitProgress(${sub.id})">تسجيل وخصم الوقت</button>
                    <button class="btn-undo" onclick="confirmUndo(${sub.id})">تراجع</button>
                </div>
            </div>

            <button class="btn-undo" style="width:100%;" onclick="openSettings(${sub.id})">⚙️ إعدادات المادة والمراجعة</button>
            <button class="btn-delete" onclick="deleteSubject(${sub.id})">حذف المادة</button>
        `;
        modal.style.display = 'flex';
    }

    function submitProgress(id) {
        const sub = subjects.find(s => s.id === id);
        let s = parseInt(document.getElementById('progSheets').value) || 0;
        let h = parseInt(document.getElementById('progHours').value) || 0;
        let m = parseInt(document.getElementById('progMins').value) || 0;

        if(!historyStack[id]) historyStack[id] = [];
        historyStack[id].push(JSON.parse(JSON.stringify(sub)));

        // 1. زيادة الشيتات المنجزة
        sub.studiedSheets += s;

        // 2. تحديث سجل ما ذاكرته فعلياً
        let historyMins = (sub.studiedHours * 60) + sub.studiedMinutes + (h * 60) + m;
        sub.studiedHours = Math.floor(historyMins / 60);
        sub.studiedMinutes = historyMins % 60;

        // 3. طرح الوقت المنجز من الوقت الكلي المتبقي (المطلوب من الطالب)
        let remainingMins = (sub.totalHours * 60) + sub.totalMinutes - (h * 60) - m;
        if (remainingMins < 0) remainingMins = 0;
        sub.totalHours = Math.floor(remainingMins / 60);
        sub.totalMinutes = remainingMins % 60;

        save();
        openDetails(id);
        showToast("تم تحديث الإنجاز وخصم الوقت");
    }

    function confirmUndo(id) {
        if (!historyStack[id] || historyStack[id].length === 0) {
            showToast("لا يوجد عمليات للتراجع عنها");
            return;
        }
        if (confirm("هل تريد التراجع عن آخر عملية تسجيل؟")) {
            const lastState = historyStack[id].pop();
            const index = subjects.findIndex(s => s.id === id);
            subjects[index] = lastState;
            save();
            openDetails(id);
            showToast("تم التراجع");
        }
    }

    function openSettings(id) {
        const sub = subjects.find(s => s.id === id);
        const modal = document.getElementById('settingsModal');
        const content = document.getElementById('settingsContent');

        content.innerHTML = `
            <div class="row" style="flex-direction:column; gap:12px;">
                <label>اسم المادة</label>
                <input type="text" id="setName" value="${escapeHtml(sub.name)}">
                
                <label>تاريخ الامتحان</label>
                <input type="date" id="setDate" value="${sub.examDate}">

                <label>بدّي أكمل قبل الامتحان بـ (عدد أيام):</label>
                <input type="number" id="setReviewDays" value="${sub.reviewDaysBefore}" onfocus="this.select()">
                
                <label>إجمالي الشيتات المتبقية</label>
                <input type="number" id="setSheets" value="${sub.totalSheets}" onfocus="this.select()">
                
                <label>الوقت المتبقي الكلي (ساعة : دقيقة)</label>
                <div class="time-input-group">
                    <input type="number" id="setHours" value="${sub.totalHours}" onfocus="this.select()">
                    <input type="number" id="setMins" value="${sub.totalMinutes}" max="59" onfocus="this.select()" oninput="if(this.value>59)this.value=59">
                </div>
                
                <button class="btn-save" onclick="saveSettings(${sub.id})">حفظ البيانات</button>
            </div>
        `;
        modal.style.display = 'flex';
    }

    function saveSettings(id) {
        const sub = subjects.find(s => s.id === id);
        sub.name = document.getElementById('setName').value || "بدون اسم";
        sub.examDate = document.getElementById('setDate').value;
        sub.reviewDaysBefore = parseInt(document.getElementById('setReviewDays').value) || 0;
        sub.totalSheets = parseInt(document.getElementById('setSheets').value) || 0;
        sub.totalHours = parseInt(document.getElementById('setHours').value) || 0;
        sub.totalMinutes = parseInt(document.getElementById('setMins').value) || 0;

        save();
        closeSettings();
        openDetails(id);
        renderMain();
        showToast("تم الحفظ");
    }

    function addNewSubject() {
        const todayStr = new Date().toISOString().split('T')[0];
        const newSub = {
            id: Date.now(),
            name: "مادة جديدة",
            examDate: todayStr,
            reviewDaysBefore: 1,
            totalSheets: 0,
            totalHours: 0,
            totalMinutes: 0,
            studiedSheets: 0,
            studiedHours: 0,
            studiedMinutes: 0
        };
        subjects.push(newSub);
        historyStack[newSub.id] = [];
        save();
        renderMain();
        openSettings(newSub.id);
    }

    function deleteSubject(id) {
        if(confirm("هل أنت متأكد من حذف هذه المادة؟")) {
            subjects = subjects.filter(s => s.id !== id);
            save(); closeModal(); renderMain();
        }
    }

    function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    function showToast(msg) {
        const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
        document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
    }
    function resetAll() {
        if(confirm("سيتم تصفير كل البيانات، هل أنت متأكد؟")) {
            localStorage.removeItem(STORAGE_KEY); subjects = []; renderMain();
        }
    }
    function escapeHtml(str) {
        const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
    }

    window.onload = () => { load(); renderMain(); };
</script>
</body>
</html>
